<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0d0f1a" />
      <stop offset="60%" stop-color="#060810" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00b8d4" />
      <stop offset="100%" stop-color="#0091ea" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff" />
      <stop offset="50%" stop-color="#651fff" />
      <stop offset="100%" stop-color="#304ffe" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="206" fill="url(#bgGrad)" />

  <!-- Core glow -->
  <circle cx="512" cy="512" r="180" fill="#00e5ff" opacity="0.06" />
  <circle cx="512" cy="512" r="350" fill="#7c4dff" opacity="0.04" />

  <!-- Outer hexagon (cyan) -->
  <polygon points="512,172 806,342 806,682 512,852 218,682 218,342"
           fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.7" />

  <!-- Middle hexagon (rotated 30°, indigo) -->
  <polygon points="512,252 737,382 737,642 512,772 287,642 287,382"
           fill="none" stroke="url(#indigoGrad)" stroke-width="1.8" filter="url(#softGlow)" opacity="0.5"
           transform="rotate(30 512 512)" />

  <!-- Inner diamond (rotated 45°) -->
  <rect x="372" y="372" width="280" height="280" rx="2"
        fill="none" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glow)" opacity="0.6"
        transform="rotate(45 512 512)" />

  <!-- Inner hexagon (small) -->
  <polygon points="512,352 651,432 651,592 512,672 373,592 373,432"
           fill="none" stroke="url(#indigoGrad)" stroke-width="2.2" filter="url(#glow)" opacity="0.8" />

  <!-- Core diamond (small, bright) -->
  <rect x="452" y="452" width="120" height="120" rx="1"
        fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.9"
        transform="rotate(45 512 512)" />

  <!-- Center dot -->
  <circle cx="512" cy="512" r="10" fill="#00e5ff" filter="url(#glow)" opacity="0.9" />
  <circle cx="512" cy="512" r="4" fill="#fff" opacity="0.8" />

  <!-- Vertex dots on outer hex -->
  <circle cx="512" cy="172" r="5" fill="#00e5ff" filter="url(#glow)" opacity="0.7" />
  <circle cx="806" cy="342" r="4" fill="#00b8d4" filter="url(#glow)" opacity="0.5" />
  <circle cx="806" cy="682" r="4" fill="#0091ea" filter="url(#glow)" opacity="0.5" />
  <circle cx="512" cy="852" r="5" fill="#7c4dff" filter="url(#glow)" opacity="0.7" />
  <circle cx="218" cy="682" r="4" fill="#651fff" filter="url(#glow)" opacity="0.5" />
  <circle cx="218" cy="342" r="4" fill="#304ffe" filter="url(#glow)" opacity="0.5" />

  <!-- Corner accents -->
  <line x1="172" y1="232" x2="172" y2="312" stroke="#00e5ff" stroke-width="1.5" filter="url(#softGlow)" opacity="0.35" />
  <line x1="852" y1="232" x2="852" y2="312" stroke="#7c4dff" stroke-width="1.5" filter="url(#softGlow)" opacity="0.35" />
  <line x1="172" y1="792" x2="172" y2="712" stroke="#7c4dff" stroke-width="1.5" filter="url(#softGlow)" opacity="0.35" />
  <line x1="852" y1="792" x2="852" y2="712" stroke="#00e5ff" stroke-width="1.5" filter="url(#softGlow)" opacity="0.35" />
</svg>
